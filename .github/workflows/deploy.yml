name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions needed for the GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs for newer pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing after this step uses git; don't leave a token in .git/config.
          persist-credentials: false

      # Third-party action, so it is pinned to a full commit SHA rather than a
      # mutable tag — a compromised v2 tag would otherwise run with repo
      # checkout access. Update deliberately; SHA below is v2.2.0.
      # bun-version is pinned too: bunfig.toml's minimumReleaseAge guard covers
      # npm packages, not the toolchain, and an unpinned Bun can break the build
      # with no change on our side.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - run: bun install --frozen-lockfile

      # TanStack Start prerenders every route to static HTML under dist/client
      # (includes the public/ assets and .nojekyll).
      # No VITE_BASE_PATH: this deploys to a *.github.io user page served at the
      # domain root, so vite.config.ts's "/" default is correct. If it is ever
      # deployed to a PROJECT page (github.io/<repo>/), set VITE_BASE_PATH to
      # "/<repo>/" here or every asset URL 404s.
      # Also installs dist/client/404.html from the prerendered /404 route
      # (scripts/postbuild.ts), so the same 404 you get from `bun run preview`
      # is the one that ships. It used to be a `cp index.html 404.html` here,
      # which served the whole homepage at broken URLs.
      - run: bun run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
